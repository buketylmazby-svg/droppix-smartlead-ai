<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Droppix AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        #chat-box { border: 1px solid #ccc; padding: 15px; height: 300px; overflow-y: auto; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9; }
        .input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .user-msg { color: #0056b3; margin: 5px 0; }
        .ai-msg { color: #155724; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Droppix AI Chat</h1>
    
    <div id="chat-box"></div>
    
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') gonder()">
        <button onclick="gonder()">Gönder</button>
    </div>

    <script>
        async function gonder() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const mesaj = input.value.trim();
            
            if (!mesaj) return;

            // Kullanıcı mesajını ekrana ekle
            chatBox.innerHTML += `<div class="user-msg"><strong>Siz:</strong> ${mesaj}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Rota adını /api/chat olarak güncelledik
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: mesaj })
                });
                
                const data = await res.json();

                if (data.basari) {
                    chatBox.innerHTML += `<div class="ai-msg"><strong>Droppix AI:</strong> ${data.cevap}</div>`;
                } else {
                    chatBox.innerHTML += `<div style="color:red;"><strong>Hata:</strong> ${data.hata}</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div style="color:red;"><strong>Hata:</strong> Sunucuya ulaşılamadı.</div>`;
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
